name: Build Nexa Android APK

on:
  push:
    branches:
      - nexa-android-build
    paths:
      - 'nexa-android/**'
      - '.github/workflows/nexa-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p nexa-android assembleDebug --stacktrace

      - name: Copy APK
        run: cp nexa-android/app/build/outputs/apk/debug/app-debug.apk Nexa-IPTV-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-IPTV-Player-APK
          path: Nexa-IPTV-Player.apk
          if-no-files-found: error
